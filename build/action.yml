name: Build ADI Yocto artifacts
description: kas based build

inputs:
  machine:
    description: "Yocto machine"
  image:
    description: "Yocto image"
  build-config-file:
    description: "kas config file, relative to the checkout"
  build-sdk:
    description: "Build the SDK installer for this image"
    default: 'true'
  upload-artifacts:
    description: "Store image artifacts and expose them to cloudsmith"
    default: 'true'
  gh-token:
    description: "GitHub token for cloning repositories"
    default: ${{ github.token }}
  cloudsmith-namespace:
    description: "Cloudsmith namespace"
    default: "adi"
  cloudsmith-service-slug:
    description: "Cloudsmith service slug, empty to skip"
    default: ""
  cloudsmith-api-key:
    description: "Cloudsmith key  (skip OIDC if set)"
    default: ""

outputs:
  artifact-name:
    description: "Base name of the uploaded artifacts"
    value: ${{ steps.workspace.outputs.artifact-name }}

runs:
  using: 'composite'
  steps:
    - uses: analogdevicesinc/shared-actions/cloudsmith-auth@main
      if: ${{ inputs.cloudsmith-service-slug != '' }}
      with:
        namespace: ${{ inputs.cloudsmith-namespace }}
        service-slug: ${{ inputs.cloudsmith-service-slug }}
        api-key: ${{ inputs.cloudsmith-api-key }}

    - name: Set github token
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        git config --global credential.helper 'store'
        echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials
        { git config --global --get-regexp '^url\..*\.insteadOf$' || :; } |
          awk '$2 == "https://github.com/" { print $1 }' |
          xargs -r -n1 git config --global --unset-all
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global --add url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
        git config --global --add url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"

    - name: Setup build workspace
      id: workspace
      shell: bash
      env:
        MACHINE: ${{ inputs.machine }}
        IMAGE: ${{ inputs.image }}
      run: |
        ARTIFACT_NAME=$(printf '%s-%s' "${MACHINE}" "${IMAGE}" | tr -cd '[:alnum:]._-')
        echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV
        echo "artifact-name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

        WORKSPACE="${GITHUB_WORKSPACE}/yocto-build-${GITHUB_RUN_ID}-${ARTIFACT_NAME}"
        mkdir -p "${WORKSPACE}"

        [ -d "/cache" ] && YOCTO_CACHE_DIR="/cache/yocto" || YOCTO_CACHE_DIR="${GITHUB_WORKSPACE}/yocto-cache"
        mkdir -p "${YOCTO_CACHE_DIR}/downloads" "${YOCTO_CACHE_DIR}/sstate" "${YOCTO_CACHE_DIR}/hashserv"

        echo "YOCTO_WORKSPACE=${WORKSPACE}" >> $GITHUB_ENV
        echo "YOCTO_DL_DIR=${YOCTO_CACHE_DIR}/downloads" >> $GITHUB_ENV
        echo "YOCTO_SSTATE_DIR=${YOCTO_CACHE_DIR}/sstate" >> $GITHUB_ENV
        echo "YOCTO_HASHSERVE_DIR=${YOCTO_CACHE_DIR}/hashserv" >> $GITHUB_ENV

        echo "KAS_WORK_DIR=${WORKSPACE}" >> $GITHUB_ENV
        echo "KAS_BUILD_DIR=${WORKSPACE}/build" >> $GITHUB_ENV
        # Override the kas config machine
        echo "KAS_MACHINE=${MACHINE}" >> $GITHUB_ENV

    - name: Install kas
      shell: bash
      run: |
        python3 -m venv "${YOCTO_WORKSPACE}/venv"
        source "${YOCTO_WORKSPACE}/venv/bin/activate"
        pip3 install kas

    - name: kas checkout
      shell: bash
      env:
        KAS_FILE: ${{ github.workspace }}/${{ inputs.build-config-file }}
      run: |
        source "${YOCTO_WORKSPACE}/venv/bin/activate"
        kas checkout "${KAS_FILE}"

    - name: Configure persistent caches
      shell: bash
      env:
        CLOUDSMITH_SERVICE_SLUG: ${{ inputs.cloudsmith-service-slug }}
      run: |
        if [[ -n "${CLOUDSMITH_SERVICE_SLUG}" ]]; then
          cat > "${RUNNER_TEMP}/netrc" <<EOF
        machine dl.cloudsmith.io
        login ${CLOUDSMITH_SERVICE_SLUG}
        password ${CLOUDSMITH_API_KEY}
        EOF
          chmod 600 "${RUNNER_TEMP}/netrc"
          echo "NETRC_FILE=${RUNNER_TEMP}/netrc" >> "$GITHUB_ENV"
        fi

        cat > "${KAS_BUILD_DIR}/conf/auto.conf" <<EOF
        DL_DIR = "${YOCTO_DL_DIR}"
        SSTATE_DIR = "${YOCTO_SSTATE_DIR}"
        BB_HASHSERVE_DB_DIR = "${YOCTO_HASHSERVE_DIR}"
        BB_SRCREV_POLICY = "cache"
        EOF

        # Generate an SPDX SBOM
        if find "${KAS_WORK_DIR}" \( -path "${KAS_BUILD_DIR}" -o -path "${YOCTO_WORKSPACE}/venv" \) -prune \
             -o -type f -name 'create-spdx-3.0.bbclass' -print | grep -q .; then
          cat >> "${KAS_BUILD_DIR}/conf/auto.conf" <<EOF
        INHERIT:remove = "create-spdx"
        INHERIT += "create-spdx-3.0"
        EOF
        else
          echo 'INHERIT += "create-spdx"' >> "${KAS_BUILD_DIR}/conf/auto.conf"
        fi

    - name: Build image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        BUILD_SDK: ${{ inputs.build-sdk }}
        KAS_FILE: ${{ github.workspace }}/${{ inputs.build-config-file }}
      run: |
        source "${YOCTO_WORKSPACE}/venv/bin/activate"
        umask 022
        fetch_targets="${IMAGE}"
        [[ "${BUILD_SDK}" == "true" ]] && fetch_targets+=" ${IMAGE}:do_populate_sdk"
        kas shell "${KAS_FILE}" -c "bitbake --runall=fetch ${fetch_targets} && bitbake ${IMAGE}" --update

    - name: Build SDK
      if: ${{ inputs.build-sdk == 'true' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        KAS_FILE: ${{ github.workspace }}/${{ inputs.build-config-file }}
      run: |
        source "${YOCTO_WORKSPACE}/venv/bin/activate"
        umask 022
        kas shell "${KAS_FILE}" -c "bitbake ${IMAGE} -c populate_sdk"

    - name: Collect build manifests
      if: ${{ inputs.upload-artifacts == 'true' }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        MACHINE: ${{ inputs.machine }}
        KAS_FILE: ${{ github.workspace }}/${{ inputs.build-config-file }}
      run: |
        # License manifests and the recipe/layer list of this image, under
        # stable names, one image per artifact.
        out="${KAS_BUILD_DIR}/tmp/deploy/manifests"
        deploy="${KAS_BUILD_DIR}/tmp/deploy"
        rm -rf "$out" && mkdir -p "$out"

        # Layout of deploy/licenses changed across Yocto releases; pick the
        # newest directory for this image/machine.
        lic_dir=$(find "${deploy}/licenses" -type f -name license.manifest \
            -path "*${IMAGE}-${MACHINE}*" -printf '%T@ %h\n' | sort -rn | head -n1 | cut -d' ' -f2-)
        [[ -n "$lic_dir" ]] || { echo "::error::license.manifest not found for ${IMAGE}-${MACHINE}"; exit 1; }
        cp "${lic_dir}/license.manifest" "$out/license.manifest"
        if [[ -f "${lic_dir}/image_license.manifest" ]]; then
          cp "${lic_dir}/image_license.manifest" "$out/image_license.manifest"
        else
          echo "::warning::image_license.manifest not found in ${lic_dir}"
        fi

        source "${YOCTO_WORKSPACE}/venv/bin/activate"
        umask 022
        kas shell "${KAS_FILE}" -c "bitbake-layers show-recipes" > "$out/bitbake-layers.txt"

        printf 'image=%s\nmachine=%s\n' "$IMAGE" "$MACHINE" > "$out/metadata.txt"
        ls -l "$out"

    - name: Upload Yocto images
      uses: actions/upload-artifact@v7
      if: ${{ inputs.upload-artifacts == 'true' }}
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.KAS_BUILD_DIR }}/tmp/deploy/images/${{ inputs.machine }}

    - name: Upload SBOM
      uses: actions/upload-artifact@v7
      if: ${{ inputs.upload-artifacts == 'true' }}
      with:
        name: ${{ env.ARTIFACT_NAME }}.sbom
        path: |
          ${{ env.KAS_BUILD_DIR }}/tmp/deploy/images/${{ inputs.machine }}/${{ inputs.image }}-${{ inputs.machine }}.rootfs.spdx*
          ${{ env.KAS_BUILD_DIR }}/tmp/deploy/spdx/
          ${{ env.KAS_BUILD_DIR }}/tmp/deploy/manifests/
          !${{ env.KAS_BUILD_DIR }}/tmp/deploy/spdx/**/by-namespace/**
          !${{ env.KAS_BUILD_DIR }}/tmp/deploy/spdx/**/by-hash/**

    - name: Locate SDK installer
      if: ${{ inputs.build-sdk == 'true' }}
      shell: bash
      run: |
        SDK_INSTALLER=$(ls "${KAS_BUILD_DIR}/tmp/deploy/sdk/"*.sh | head -n1)
        echo "SDK_INSTALLER=${SDK_INSTALLER}" >> $GITHUB_ENV

    - name: Upload SDK installer as artifact
      uses: actions/upload-artifact@v7
      if: ${{ inputs.build-sdk == 'true' && inputs.upload-artifacts == 'true' }}
      with:
        name: ${{ env.ARTIFACT_NAME }}.sdk
        path: ${{ env.SDK_INSTALLER }}

    - name: Archive output images directory
      if: ${{ github.event_name == 'release' }}
      shell: bash
      env:
        MACHINE: ${{ inputs.machine }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        tar -cJvf "${YOCTO_WORKSPACE}/images-${ARTIFACT_NAME}-${RELEASE_TAG}.tar.xz" \
          -C "${KAS_BUILD_DIR}/tmp/deploy/images" \
          "${MACHINE}"

    - name: Upload release archive as artifact
      uses: actions/upload-artifact@v7
      if: ${{ github.event_name == 'release' && inputs.upload-artifacts == 'true' }}
      with:
        name: images-${{ env.ARTIFACT_NAME }}-${{ github.event.release.tag_name }}.tar.xz
        path: ${{ env.YOCTO_WORKSPACE }}/images-${{ env.ARTIFACT_NAME }}-${{ github.event.release.tag_name }}.tar.xz

    - name: Clean up build
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        rm -f ~/.git-credentials
        git config --global --remove-section "url.https://x-access-token:${GH_TOKEN}@github.com/" 2>/dev/null || :
        [[ -n "${YOCTO_WORKSPACE}" ]] && rm -rf "${YOCTO_WORKSPACE}"
