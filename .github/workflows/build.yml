name: Build ADI Yocto artifacts

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner (defaults to vars.RUNNER)'
        type: string
        default: ""
      ref:
        description: "Reference to checkout"
        type: string
        required: false
      machine:
        description: "Yocto machine"
        default: "adsp-sc598-som-ezkit"
        required: true
      image:
        description: "Yocto image"
        default: "adsp-sc5xx-minimal"
        required: true
      build-config-file:
        description: "kas config file, relative to the checkout"
        type: string
        required: true
      build-sdk:
        description: "Build the SDK installer for this image"
        type: boolean
        default: true
      upload-artifacts:
        description: "Store image artifacts and expose them to cloudsmith"
        type: boolean
        default: true
      app-token-repositories:
        description: "Repositories to scope a GitHub App Token to"
        type: string
        default: ""
  workflow_call:
    inputs:
      runner:
        type: string
        default: ""
      ref:
        type: string
        required: false
      machine:
        type: string
        required: true
      image:
        type: string
        required: true
      build-config-file:
        type: string
        required: true
      build-sdk:
        type: boolean
        default: true
      upload-artifacts:
        type: boolean
        default: true
      app-token-repositories:
        type: string
        default: ""
    secrets:
      APP_CLIENT_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      CLOUDSMITH_SERVICE_SLUG:
        required: false
      CLOUDSMITH_API_KEY:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || vars.RUNNER != '' && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
    steps:
      - uses: actions/create-github-app-token@v3
        if: ${{ github.repository_owner == 'adi-innersource' }}
        id: app-token
        with:
          app-id: ${{ secrets.APP_CLIENT_ID  }}
          private-key: ${{ secrets.APP_PRIVATE_KEY  }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.app-token-repositories }}
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false

      - name: Build
        id: build
        uses: analogdevicesinc/meta-adi/build@ci
        with:
          machine: ${{ inputs.machine }}
          image: ${{ inputs.image }}
          build-config-file: ${{ inputs.build-config-file }}
          build-sdk: ${{ inputs.build-sdk }}
          upload-artifacts: ${{ inputs.upload-artifacts }}
          gh-token: ${{ steps.app-token.outputs.token || github.token }}
          cloudsmith-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
          cloudsmith-service-slug: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}

  release:
    needs: build
    if: ${{ github.event_name == 'release' && inputs.upload-artifacts }}
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || vars.RUNNER != '' && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "{images-${{ needs.build.outputs.artifact-name }}-${{ github.event.release.tag_name }}.tar.xz,${{ needs.build.outputs.artifact-name }}.sdk}"
          path: release
          merge-multiple: true

      - name: Upload artifacts to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: release/*
          file_glob: true
          tag: ${{ github.ref }}
